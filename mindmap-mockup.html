<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Mind Map</title>
  <style>
    :root{
      --serif:'Spectral','Iowan Old Style',Georgia,'Times New Roman',serif;
      --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --bg:#f3f1ea; --bg2:#eae7dd; --ink:#22282f; --ink-soft:#7b8595;
      --panel:#ffffff; --line:#ddd8cc; --shadow:rgba(40,50,70,.16);
      --sun1:#fff0c4; --sun2:#ffcf6b;
      --grid:rgba(90,100,120,.16); --sep:rgba(255,255,255,.85);
      --cap:#1c2128;
    }
    @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
      --bg:#12161d; --bg2:#0c1017; --ink:#e9edf4; --ink-soft:#8c98a9;
      --panel:#171d26; --line:#28313d; --shadow:rgba(0,0,0,.55);
      --sun1:#ffe6a3; --sun2:#f2b64e;
      --grid:rgba(180,195,215,.14); --sep:rgba(18,22,29,.9);
      --cap:#f2f5fa;
    }}
    :root[data-theme="dark"]{
      --bg:#12161d; --bg2:#0c1017; --ink:#e9edf4; --ink-soft:#8c98a9;
      --panel:#171d26; --line:#28313d; --shadow:rgba(0,0,0,.55);
      --sun1:#ffe6a3; --sun2:#f2b64e;
      --grid:rgba(180,195,215,.14); --sep:rgba(18,22,29,.9);
      --cap:#f2f5fa;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{font-family:var(--sans);color:var(--ink);
      background:radial-gradient(1200px 900px at 50% 44%,var(--bg2),var(--bg) 72%);overflow:hidden;}
    #app{display:flex;flex-direction:column;height:100vh;}

    .top-bar{display:flex;align-items:center;gap:14px;padding:14px 22px;flex-shrink:0;
      border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(8px);}
    .brand{display:flex;align-items:baseline;gap:10px;}
    .brand .mark{font-size:18px;}
    .brand h1{font-family:var(--serif);font-weight:600;font-size:20px;}
    .brand .sub{font-size:12px;color:var(--ink-soft);}
    .top-spacer{flex:1;}
    .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
      user-select:none;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);}
    .toggle input{accent-color:#5a9e82;}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
      color:var(--ink);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
    .icon-btn:hover{border-color:var(--ink-soft);}

    .main{display:flex;flex:1;min-height:0;position:relative;}
    #stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;}
    svg#sky{width:min(94vmin,940px);height:min(94vmin,940px);display:block;}

    .ray{cursor:pointer;}
    .wedge{transition:opacity .2s ease;}
    .ray.dim .wedge,.ray.dim .cap,.ray.dim .count,.ray.dim .taskdot{opacity:.3;}
    .cap{transition:opacity .2s;}
    .taskdot{cursor:pointer;transition:opacity .2s;}
    .taskdot:hover{stroke:var(--ink);stroke-width:2.5;}
    .count{font-family:var(--sans);font-weight:700;pointer-events:none;}
    .tag-label{font-family:var(--sans);font-weight:600;pointer-events:none;}
    /* per-task name labels: hidden until ray hover or global toggle */
    .tasklabel{font-family:var(--sans);font-size:10px;font-weight:500;opacity:0;pointer-events:none;
      transition:opacity .15s;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;}
    .ray:hover .tasklabel{opacity:1;}
    body.show-tasks .tasklabel{opacity:1;}

    @keyframes breathe{0%,100%{opacity:.5;}50%{opacity:.85;}}
    .glow{animation:breathe 6s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){.glow{animation:none;}}

    .legend{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;
      gap:18px;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb,var(--panel) 88%,transparent);
      border:1px solid var(--line);border-radius:13px;padding:9px 16px;box-shadow:0 4px 18px var(--shadow);
      font-size:11.5px;color:var(--ink-soft);max-width:92%;}
    .legend .grp{display:flex;align-items:center;gap:7px;}
    .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
    .legend .caps{width:26px;height:0;border-top:4px solid var(--cap);border-radius:2px;}
    .legend b{color:var(--ink);font-weight:600;}

    #panel{width:0;flex-shrink:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);
      transition:width .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
    #panel.open{width:352px;}
    .p-head{padding:18px 20px 14px;position:relative;}
    .p-accent{position:absolute;left:0;top:0;bottom:0;width:5px;}
    .p-kind{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;margin-bottom:7px;}
    .p-title{font-family:var(--serif);font-size:23px;line-height:1.2;margin-bottom:12px;}
    .p-chips{display:flex;flex-wrap:wrap;gap:6px;}
    .chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:9px;}
    .p-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:none;
      color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;}
    .p-body{padding:6px 20px 22px;overflow-y:auto;flex:1;}
    .p-sec{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--ink-soft);margin:16px 0 9px;}
    .row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--bg);
      margin-bottom:6px;font-size:13.5px;cursor:pointer;transition:background .15s;}
    .row:hover{background:var(--bg2);}
    .row .rnum{font-size:11px;font-weight:700;color:var(--ink-soft);width:16px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums;}
    .row .rdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .row .rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .row.done .rt{text-decoration:line-through;opacity:.55;}
    .row .rdue{font-size:11px;color:var(--ink-soft);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .add-btn{width:100%;margin-top:14px;padding:11px;border-radius:11px;border:2px dashed var(--line);
      background:transparent;color:var(--ink-soft);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}
    .add-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
    .open-btn{width:100%;margin-top:8px;padding:11px;border-radius:11px;border:none;color:#fff;
      font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
    .note{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}

    @media (max-width:760px){
      svg#sky{width:96vw;height:96vw;}
      #panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:0;border-left:none;
        border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 26px var(--shadow);z-index:40;transition:height .3s;}
      #panel.open{width:100%;height:62vh;}
      .legend{bottom:auto;top:8px;}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="brand"><span class="mark">☀️</span><h1>Mind Map</h1><span class="sub">колесо баланса · макет</span></div>
    <div class="top-spacer"></div>
    <label class="toggle"><input type="checkbox" id="show-tasks"> Показать задачи</label>
    <label class="toggle"><input type="checkbox" id="show-done"> Показать выполненные</label>
    <button class="icon-btn" id="theme-btn" title="Сменить тему">◐</button>
  </div>

  <div class="main">
    <div id="stage">
      <svg id="sky" viewBox="0 0 1000 1000" role="img" aria-label="Колесо задач"></svg>
      <div class="legend">
        <div class="grp"><b>Длина луча</b> = число задач</div>
        <div class="grp"><span class="caps"></span>граница нагрузки</div>
        <div class="grp"><span class="dot" style="background:#e0857f"></span>Высокий</div>
        <div class="grp"><span class="dot" style="background:#e0b45f"></span>Средний</div>
        <div class="grp"><span class="dot" style="background:#8fa8c6"></span>Обычный</div>
        <div class="grp"><span class="dot" style="background:#79b79b"></span>Готово</div>
        <div class="grp">срочные — ближе к центру</div>
      </div>
    </div>

    <aside id="panel">
      <div class="p-head">
        <div class="p-accent" id="p-accent"></div>
        <button class="p-close" id="p-close">×</button>
        <div class="p-kind" id="p-kind"></div>
        <div class="p-title" id="p-title"></div>
        <div class="p-chips" id="p-chips"></div>
      </div>
      <div class="p-body" id="p-body"></div>
    </aside>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────
   SAMPLE DATA (mock) — real app pulls from Firestore
   due: 'YYYY-MM-DD' | null   (today = 2026-08-16)
   ───────────────────────────────────────────── */
const T=(title,pr,due,done)=>({title,pr:pr||'none',due:due||null,done:!!done});
const DATA=[
  // ── WORK ──
  {id:'dev',label:'Dev',emoji:'💻',group:'work',tasks:[
    T('Fix recurring roll-forward bug','high','2026-08-18'),T('Redesign mind map view','high','2026-08-20'),
    T('Add PWA push notifications','med','2026-08-25'),T('Refactor store.js namespacing','med'),
    T('Write firestore.rules tests','low'),T('Voice input RU accuracy','low'),
    T('Upgrade Firebase SDK','none'),T('Ship worker slack signing','none',null,true),
  ]},
  {id:'clients',label:'Clients',emoji:'🤝',group:'work',tasks:[
    T('Follow up invoice #204','med','2026-08-16'),T('Call with Nordwind','high','2026-08-17'),
    T('Send Q3 proposal','high','2026-08-19'),T('Onboarding deck for Aurea','med'),
    T('Kickoff notes','none',null,true),
  ]},
  {id:'strategy',label:'Strategy',emoji:'🎯',group:'work',tasks:[
    T('2026 roadmap draft','med','2026-08-30'),T('Pricing model v2','med'),T('Competitor scan','low'),
  ]},
  {id:'analytics',label:'Analytics',emoji:'📊',group:'work',tasks:[
    T('Weekly retention report','med','2026-08-16'),T('Funnel dashboard','low'),
  ]},
  {id:'leads',label:'Leads',emoji:'📣',group:'work',tasks:[
    T('Refresh landing copy','med','2026-08-22'),T('LinkedIn outreach batch','med'),
    T('Webinar planning','low'),T('CRM cleanup','none'),
  ]},
  {id:'ux',label:'UX',emoji:'🎨',group:'work',tasks:[
    T('Pastel palette tokens','low','2026-08-21'),
  ]},
  // ── PERSONAL ──
  {id:'kids',label:'Kids',emoji:'👶',group:'personal',tasks:[
    T('School forms deadline','high','2026-08-18'),T('Dentist appointment','med','2026-08-20'),
    T('Swim lessons signup','low','2026-08-24'),T('Birthday party plan','med','2026-08-28'),
    T('Buy autumn shoes','low'),T('Read together evenings','none'),
  ]},
  {id:'health',label:'Health',emoji:'💚',group:'personal',tasks:[
    T('Renew gym pass','low','2026-08-16'),T('Annual check-up','med','2026-08-26'),T('Sleep routine','none'),
  ]},
  {id:'urgent',label:'Urgent',emoji:'🚨',group:'personal',tasks:[
    T('Pay rent','high','2026-08-16'),T('Passport renewal','high','2026-08-19'),
  ]},
  {id:'ideas',label:'Ideas',emoji:'💡',group:'personal',tasks:[
    T('Newsletter about AI tools','med'),T('Blog: sun mind maps','low'),
    T('Side project: recipe app','low'),T('Sketch garden layout','none'),T('Course on typography','none'),
  ]},
  {id:'money',label:'Money',emoji:'💰',group:'personal',tasks:[
    T('Review subscriptions','med','2026-08-23'),T('Move savings','low'),
  ]},
  {id:'home',label:'Home',emoji:'🏠',group:'personal',tasks:[
    T('Fix kitchen tap','med','2026-08-17'),T('Order air filter','low','2026-08-21'),
    T('Declutter garage','low'),T('Repaint hallway','none'),
  ]},
  {id:'travel',label:'Travel',emoji:'✈️',group:'personal',tasks:[
    T('Book autumn trip','low','2026-08-29'),
  ]},
  {id:'rest',label:'Rest',emoji:'🌊',group:'personal',tasks:[
    T('Weekend digital detox','low'),T('Plan spa day','none'),
  ]},
  {id:'swedish',label:'Swedish',emoji:'🇸🇪',group:'personal',tasks:[
    T('Duolingo streak','med'),T('Watch SVT with subs','low'),T('Vocabulary 20 words','none'),
  ]},
];

/* ─────────────────────────────────────────────
   GEOMETRY + RENDER
   ───────────────────────────────────────────── */
const SVGNS='http://www.w3.org/2000/svg';
const CX=500,CY=500;
const R_HUB=30, R_IN=38, R_OUT=432;
const GAP=12, PAD=1.4; // degrees

const sky=document.getElementById('sky');
let showDone=false, selectedIdx=null;

function el(n,a,p){const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function polar(r,deg){const a=deg*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function annularSector(r0,r1,a0,a1){
  const[x0,y0]=polar(r0,a0),[x1,y1]=polar(r1,a0),[x2,y2]=polar(r1,a1),[x3,y3]=polar(r0,a1);
  const lg=(a1-a0)>180?1:0;
  return `M${x0},${y0} L${x1},${y1} A${r1},${r1} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${lg},0 ${x0},${y0} Z`;
}
function arcPath(r,a0,a1){const[x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1);const lg=(a1-a0)>180?1:0;return `M${x0},${y0} A${r},${r} 0 ${lg},1 ${x1},${y1}`;}

function theme(){const e=document.documentElement.getAttribute('data-theme');return e||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// same saturation for every ray — only hue differs (full spectrum). Load is NOT encoded by colour.
function gradStops(hue,dark){
  return dark?[`hsl(${hue} 38% 30%)`,`hsl(${hue} 56% 52%)`]:[`hsl(${hue} 54% 87%)`,`hsl(${hue} 66% 64%)`];
}
function tagInk(hue,dark){return dark?`hsl(${hue} 60% 82%)`:`hsl(${hue} 52% 34%)`;}
function tagSoft(hue,dark){return dark?`hsl(${hue} 34% 22%)`:`hsl(${hue} 60% 95%)`;}

const PR_RANK={high:0,med:1,low:2,none:3};
const PR_COLOR={high:'#e0857f',med:'#e0b45f',low:'#8fa8c6',none:'#8fa8c6'};
function dotColor(t){return t.done?'#79b79b':(PR_COLOR[t.pr]||'#8fa8c6');}

function visibleTasks(tag){return showDone?tag.tasks:tag.tasks.filter(t=>!t.done);}
function sortByUrgency(list){
  return [...list].sort((a,b)=>{
    const ua=a.due?Date.parse(a.due):Infinity, ub=b.due?Date.parse(b.due):Infinity;
    return ua-ub || PR_RANK[a.pr]-PR_RANK[b.pr];
  });
}
function fmtDue(iso){if(!iso)return'';const[y,m,d]=iso.split('-');const mo=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];return `${+d} ${mo[+m-1]}`;}

function layout(){
  const N=DATA.length, avail=360-2*GAP, per=avail/N;
  const workCount=DATA.filter(d=>d.group==='work').length;
  let a=-90+GAP/2;
  return DATA.map((tag,i)=>{
    if(i===workCount) a+=GAP;
    const a0=a,a1=a+per,mid=(a0+a1)/2; a=a1;
    const tasks=sortByUrgency(visibleTasks(tag));
    const hue=Math.round(((mid+90)%360+360)%360);
    return {tag,i,a0,a1,mid,tasks,count:tasks.length,hue};
  });
}

function render(){
  sky.innerHTML='';
  const dark=theme()==='dark';
  const defs=el('defs',{},sky);
  const items=layout();
  const maxRings=Math.max(1,...items.map(it=>it.count));
  const step=(R_OUT-R_IN)/maxRings;

  // grid rings (scale)
  const gridG=el('g',{},sky);
  for(let k=1;k<=maxRings;k++){
    el('circle',{cx:CX,cy:CY,r:R_IN+k*step,fill:'none',stroke:getVar('--grid'),'stroke-width':1},gridG);
  }

  const raysG=el('g',{},sky);
  items.forEach(it=>{
    const stops=gradStops(it.hue,dark);
    const gid='g'+it.i;
    const grad=el('radialGradient',{id:gid,gradientUnits:'userSpaceOnUse',cx:CX,cy:CY,r:R_OUT},defs);
    el('stop',{offset:(R_IN/R_OUT),'stop-color':stops[0]},grad);
    el('stop',{offset:1,'stop-color':stops[1]},grad);

    const rayG=el('g',{class:'ray'},raysG); rayG.dataset.idx=it.i;
    const outerR=R_IN+it.count*step; // colour ends here

    // wedge, filled only up to the outermost task
    el('path',{class:'wedge',d:annularSector(R_IN,outerR,it.a0+PAD,it.a1-PAD),fill:`url(#${gid})`},rayG);

    // task dots along ray centre: urgent (inner) → not urgent (outer), even spacing
    it.tasks.forEach((task,k)=>{
      const rr=R_IN+(k+1)*step-step*0.5; // centred inside each ring band
      const[dx,dy]=polar(rr,it.mid);
      const dot=el('circle',{class:'taskdot',cx:dx,cy:dy,r:task.pr==='high'?6.5:5.2,
        fill:dotColor(task),stroke:dark?'rgba(255,255,255,.2)':'rgba(255,255,255,.85)','stroke-width':1.5},rayG);
      el('title',{},dot).textContent=`${task.title}${task.due?' · '+fmtDue(task.due):''}`;
      dot.addEventListener('click',e=>{e.stopPropagation();openTask(it,task);});

      // name label (hidden until hover / toggle). Alternate sides so neighbours don't collide.
      const lg=el('g',{transform:`translate(${dx},${dy}) rotate(${normRot(it.mid)})`},rayG);
      const flip=it.mid>90&&it.mid<270;
      const side=(k%2?1:-1)*10;
      const tx=el('text',{class:'tasklabel',x:flip?-9:9,y:side+3,'text-anchor':flip?'end':'start',fill:getVar('--ink')},lg);
      tx.textContent=trunc(task.title, Math.floor(step*2/6));
      el('title',{},tx).textContent=task.title;
    });

    // black contour cap at the tip → shows how long the ray is
    if(it.count>0){
      el('path',{class:'cap',d:arcPath(outerR,it.a0+PAD,it.a1-PAD),fill:'none',
        stroke:getVar('--cap'),'stroke-width':4,'stroke-linecap':'round'},rayG);
      // count number near the tip
      const[nx,ny]=polar(outerR-step*0.5,it.mid);
      const num=el('text',{class:'count',x:nx,y:ny,'text-anchor':'middle','dominant-baseline':'middle',
        'font-size':14,fill:getVar('--ink'),'paint-order':'stroke',stroke:dark?stops[0]:'rgba(255,255,255,.85)','stroke-width':3},rayG);
      num.textContent=it.count;
    }

    // tag label just outside the max rim, along the ray
    const[px,py]=polar(R_OUT+22,it.mid);
    const flip=it.mid>90&&it.mid<270;
    const lg=el('g',{transform:`translate(${px},${py}) rotate(${normRot(it.mid)})`},rayG);
    const lab=el('text',{class:'tag-label',x:flip?-4:4,y:4,'text-anchor':flip?'end':'start',
      'font-size':13,fill:tagInk(it.hue,dark)},lg);
    lab.textContent=`${it.tag.emoji} ${it.tag.label}`;

    rayG.addEventListener('click',()=>openTag(it));
    rayG.addEventListener('mouseenter',()=>dimOthers(it.i));
    rayG.addEventListener('mouseleave',()=>dimOthers(null));
  });

  // centre hub
  const g=el('radialGradient',{id:'sun',cx:'40%',cy:'36%',r:'72%'},defs);
  el('stop',{offset:'0%','stop-color':getVar('--sun1')},g);
  el('stop',{offset:'100%','stop-color':getVar('--sun2')},g);
  const gg=el('radialGradient',{id:'glow',cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{offset:'0%','stop-color':getVar('--sun2'),'stop-opacity':.5},gg);
  el('stop',{offset:'100%','stop-color':getVar('--sun2'),'stop-opacity':0},gg);
  el('circle',{class:'glow',cx:CX,cy:CY,r:R_HUB+22,fill:'url(#glow)','pointer-events':'none'},sky);
  el('circle',{cx:CX,cy:CY,r:R_HUB,fill:'url(#sun)',stroke:getVar('--sun2'),'stroke-width':2},sky);

  applyDim();
}

function normRot(deg){return (deg>90&&deg<270)?deg+180:deg;}
function trunc(s,n){return s.length>n?s.slice(0,Math.max(1,n-1))+'…':s;}

function dimOthers(hoverIdx){
  const focus=hoverIdx!==null?hoverIdx:selectedIdx;
  document.querySelectorAll('.ray').forEach(r=>r.classList.toggle('dim',focus!==null&&+r.dataset.idx!==focus));
}
function applyDim(){dimOthers(null);}

/* ── PANEL ── */
const panel=document.getElementById('panel');
function openPanel(){panel.classList.add('open');}
function closePanel(){panel.classList.remove('open');selectedIdx=null;applyDim();}
document.getElementById('p-close').addEventListener('click',closePanel);

function openTag(it){
  selectedIdx=it.i;applyDim();
  const dark=theme()==='dark',tag=it.tag;
  const active=it.tasks, done=tag.tasks.filter(t=>t.done);
  document.getElementById('p-accent').style.background=tagInk(it.hue,dark);
  const kind=document.getElementById('p-kind');
  kind.textContent=tag.group==='work'?'Рабочий тэг':'Личный тэг'; kind.style.color=tagInk(it.hue,dark);
  document.getElementById('p-title').textContent=`${tag.emoji} ${tag.label}`;
  document.getElementById('p-chips').innerHTML=
    `<span class="chip" style="background:${tagSoft(it.hue,dark)};color:${tagInk(it.hue,dark)}">${it.count} задач</span>`+
    `<span class="chip" style="background:var(--bg);color:var(--ink-soft)">${done.length} готово</span>`;
  let html=`<div class="p-sec">По срочности — сверху самое срочное</div>`;
  html+=active.length?active.map((t,i)=>rowHtml(t,i+1)).join(''):`<div class="note">Нет активных задач</div>`;
  if(showDone&&done.length) html+=`<div class="p-sec">Выполнено</div>`+done.map(t=>rowHtml(t)).join('');
  html+=`<button class="open-btn" style="background:${tagInk(it.hue,dark)}">→ Открыть область</button>`;
  html+=`<button class="add-btn">+ Добавить задачу в «${tag.label}»</button>`;
  document.getElementById('p-body').innerHTML=html;
  openPanel();
}
function rowHtml(t,n){
  return `<div class="row ${t.done?'done':''}">${n?`<span class="rnum">${n}</span>`:'<span class="rnum"></span>'}`+
    `<span class="rdot" style="background:${dotColor(t)}"></span><span class="rt">${esc(t.title)}</span>`+
    `${t.due?`<span class="rdue">${fmtDue(t.due)}</span>`:''}</div>`;
}
function openTask(it,task){
  selectedIdx=it.i;applyDim();
  const dark=theme()==='dark';
  document.getElementById('p-accent').style.background=dotColor(task);
  const kind=document.getElementById('p-kind'); kind.textContent='Задача'; kind.style.color=tagInk(it.hue,dark);
  document.getElementById('p-title').textContent=task.title;
  const prLabel={high:'Высокий приоритет',med:'Средний',low:'Обычный',none:'Без приоритета'}[task.pr];
  document.getElementById('p-chips').innerHTML=
    `<span class="chip" style="background:${dotColor(task)}22;color:${dotColor(task)}">${task.done?'Готово':prLabel}</span>`+
    (task.due?`<span class="chip" style="background:var(--bg);color:var(--ink-soft)">📅 ${fmtDue(task.due)}</span>`:'')+
    `<span class="chip" style="background:${tagSoft(it.hue,dark)};color:${tagInk(it.hue,dark)}">${it.tag.emoji} ${it.tag.label}</span>`;
  document.getElementById('p-body').innerHTML=
    `<div class="note">Часть области <b>${it.tag.emoji} ${it.tag.label}</b>. В реальном приложении здесь подзадачи, заметки и статус.</div>`+
    `<button class="open-btn" style="background:${dotColor(task)}">→ Открыть задачу</button>`+
    `<button class="add-btn">+ Добавить подзадачу</button>`;
  openPanel();
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── CONTROLS ── */
document.getElementById('show-tasks').addEventListener('change',e=>document.body.classList.toggle('show-tasks',e.target.checked));
document.getElementById('show-done').addEventListener('change',e=>{showDone=e.target.checked;render();if(selectedIdx!==null)closePanel();});
document.getElementById('theme-btn').addEventListener('click',()=>{const c=theme();document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');render();if(selectedIdx!==null)closePanel();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme'))render();});

render();
</script>
</body>
</html>
