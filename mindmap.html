<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Twin">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Twin</title>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --serif:'Spectral','Iowan Old Style',Georgia,'Times New Roman',serif;
      --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --bg:#f3f1ea; --bg2:#eae7dd; --ink:#22282f; --ink-soft:#7b8595;
      --panel:#ffffff; --line:#ddd8cc; --shadow:rgba(40,50,70,.16);
      --sun1:#fff0c4; --sun2:#ffcf6b;
      --grid:rgba(90,100,120,.14);
      --cap:#9aa1ab; --leader:rgba(90,100,120,.45);
    }
    @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
      --bg:#12161d; --bg2:#0c1017; --ink:#e9edf4; --ink-soft:#8c98a9;
      --panel:#171d26; --line:#28313d; --shadow:rgba(0,0,0,.55);
      --sun1:#ffe6a3; --sun2:#f2b64e;
      --grid:rgba(180,195,215,.13);
      --cap:#7f8a99; --leader:rgba(170,185,205,.4);
    }}
    :root[data-theme="dark"]{
      --bg:#12161d; --bg2:#0c1017; --ink:#e9edf4; --ink-soft:#8c98a9;
      --panel:#171d26; --line:#28313d; --shadow:rgba(0,0,0,.55);
      --sun1:#ffe6a3; --sun2:#f2b64e;
      --grid:rgba(180,195,215,.13);
      --cap:#7f8a99; --leader:rgba(170,185,205,.4);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:var(--sans);color:var(--ink);
      background:radial-gradient(1200px 900px at 50% 44%,var(--bg2),var(--bg) 72%);}
    #app{display:flex;flex-direction:column;height:100vh;}

    .top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-shrink:0;
      border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(8px);}
    .back-btn{color:var(--ink-soft);font-size:14px;background:none;border:none;cursor:pointer;font-family:var(--sans);}
    .back-btn:hover{color:var(--ink);}
    .brand{display:flex;align-items:baseline;gap:9px;}
    .brand .mark{font-size:17px;}
    .brand h1{font-family:var(--serif);font-weight:600;font-size:19px;}
    .brand .stat{font-size:12px;color:var(--ink-soft);}
    .top-spacer{flex:1;}
    .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;
      user-select:none;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;}
    .toggle input{accent-color:#5a9e82;}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
      color:var(--ink);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .icon-btn:hover{border-color:var(--ink-soft);}
    .icon-btn.on{border-color:var(--ink-soft);background:var(--bg2);}

    .main{display:flex;flex:1;min-height:0;position:relative;}
    #stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;padding:10px;}
    svg#sky{width:min(88vmin,880px);height:min(88vmin,880px);display:block;overflow:visible;}

    .ray{cursor:pointer;}
    .wedge{transition:opacity .2s ease;}
    .ray.dim .wedge,.ray.dim .cap,.ray.dim .count,.ray.dim .taskdot,.ray.dim .tag-label{opacity:.28;}
    .taskdot{cursor:pointer;transition:opacity .2s;}
    .taskdot:hover{stroke:var(--ink);}
    .count{font-family:var(--sans);font-weight:700;pointer-events:none;}
    .tag-label{font-family:var(--sans);font-weight:600;pointer-events:none;}
    .tasklabel,.leader{opacity:0;transition:opacity .15s;pointer-events:none;}
    .tasklabel{font-family:var(--sans);font-size:11px;font-weight:500;
      paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;}
    .leader{stroke:var(--leader);stroke-width:1;}
    .ray:hover .tasklabel,.ray:hover .leader{opacity:1;}
    body.show-tasks .tasklabel,body.show-tasks .leader{opacity:1;}

    @keyframes breathe{0%,100%{opacity:.5;}50%{opacity:.85;}}
    .glow{animation:breathe 6s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){.glow{animation:none;}}

    .legend{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(6px);display:flex;align-items:center;
      gap:16px;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb,var(--panel) 94%,transparent);
      border:1px solid var(--line);border-radius:13px;padding:9px 16px;box-shadow:0 4px 18px var(--shadow);
      font-size:11.5px;color:var(--ink-soft);max-width:92%;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
    .legend.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
    .legend .grp{display:flex;align-items:center;gap:7px;}
    .legend .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
    .legend .dot.ring{background:transparent;border:1.7px solid var(--ink-soft);}
    .legend .dot.ring.bold{border-width:3px;}
    .legend .dot.done{background:#9aa1ab;}
    .legend .caps{width:24px;height:0;border-top:2.5px solid var(--cap);border-radius:2px;}
    .legend b{color:var(--ink);font-weight:600;}

    #panel{width:0;flex-shrink:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);
      transition:width .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
    #panel.open{width:352px;}
    .p-head{padding:18px 20px 14px;position:relative;}
    .p-accent{position:absolute;left:0;top:0;bottom:0;width:5px;}
    .p-kind{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;margin-bottom:7px;}
    .p-title{font-family:var(--serif);font-size:23px;line-height:1.2;margin-bottom:12px;}
    .p-chips{display:flex;flex-wrap:wrap;gap:6px;}
    .chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:9px;}
    .p-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:none;
      color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;}
    .p-body{padding:6px 20px 22px;overflow-y:auto;flex:1;}
    .p-sec{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--ink-soft);margin:16px 0 9px;}
    .row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--bg);
      margin-bottom:6px;font-size:13.5px;cursor:pointer;transition:background .15s;}
    .row:hover{background:var(--bg2);}
    .row .rnum{font-size:11px;font-weight:700;color:var(--ink-soft);width:16px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums;}
    .row .rdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .row .rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .row.done .rt{text-decoration:line-through;opacity:.55;}
    .row .rdue{font-size:11px;color:var(--ink-soft);flex-shrink:0;font-variant-numeric:tabular-nums;}
    .subrow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:6px;font-size:13px;cursor:pointer;}
    .subrow:hover{background:var(--bg2);}
    .check{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);background:var(--panel);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;color:var(--panel);}
    .check.done{background:#5a9e82;border-color:#5a9e82;color:#fff;}
    .add-btn{width:100%;margin-top:14px;padding:11px;border-radius:11px;border:2px dashed var(--line);
      background:transparent;color:var(--ink-soft);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}
    .add-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
    .open-btn{width:100%;margin-top:8px;padding:11px;border-radius:11px;border:none;color:#fff;
      font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
    .done-btn{width:100%;margin-top:8px;padding:11px;border-radius:11px;border:none;background:#5a9e82;color:#fff;
      font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
    .done-btn.reopen{background:#c49a4a;}
    .note{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}

    #loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
    .loading-icon{font-size:46px;animation:pulse 1.4s ease infinite;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

    @media (max-width:760px){
      svg#sky{width:96vw;height:96vw;}
      #panel{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:0;border-left:none;
        border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 26px var(--shadow);z-index:40;transition:height .3s;}
      #panel.open{width:100%;height:64vh;}
      .legend{bottom:auto;top:8px;}
      .brand .stat{display:none;}
    }
  </style>
</head>
<body>
<div id="loading"><div class="loading-icon">☀️</div></div>

<div id="app" style="display:none">
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    <div class="brand"><span class="mark">☀️</span><h1>Mind Map</h1><span class="stat" id="stat"></span></div>
    <div class="top-spacer"></div>
    <label class="toggle"><input type="checkbox" id="show-tasks"> Задачи</label>
    <label class="toggle"><input type="checkbox" id="show-done"> Выполненные</label>
    <button class="icon-btn" id="legend-btn" title="Легенда">?</button>
    <button class="icon-btn" id="theme-btn" title="Тема">◐</button>
  </div>

  <div class="main">
    <div id="stage">
      <svg id="sky" viewBox="0 0 1000 1000" role="img" aria-label="Колесо задач"></svg>
      <div class="legend">
        <div class="grp"><b>Длина луча</b> = число задач (лог. шкала)</div>
        <div class="grp"><span class="caps"></span>граница нагрузки</div>
        <div class="grp"><span class="dot ring"></span>Задача</div>
        <div class="grp"><span class="dot ring bold"></span>Высокий приоритет</div>
        <div class="grp"><span class="dot done"></span>Выполнено</div>
        <div class="grp">срочные — ближе к центру</div>
      </div>
    </div>

    <aside id="panel">
      <div class="p-head">
        <div class="p-accent" id="p-accent"></div>
        <button class="p-close" id="p-close">×</button>
        <div class="p-kind" id="p-kind"></div>
        <div class="p-title" id="p-title"></div>
        <div class="p-chips" id="p-chips"></div>
      </div>
      <div class="p-body" id="p-body"></div>
    </aside>
  </div>
</div>

<script type="module">
import { db, collection, getDocs, doc, getDoc, setDoc, requireAuth, migrateIfOwner } from "./store.js";

/* ── TAGS ── */
// A new account starts with NO tags — the onboarding assistant creates a set
// tailored to the user (create_tag). Never seed a canned taxonomy.
let TAGS_CONFIG = { work: [], personal: [] };
async function loadTags() {
  try {
    const snap = await getDoc(doc(db,'meta','tags'));
    // No doc yet = brand-new account: stay empty rather than writing a default set
    if (snap.exists()) {
      const d = snap.data() || {};
      TAGS_CONFIG = { work: d.work || [], personal: d.personal || [] };
    }
  } catch(e) { console.warn('loadTags failed, starting with no tags'); }
}
function tagList(){
  return [
    ...(TAGS_CONFIG.work||[]).map(t=>({...t,group:'work'})),
    ...(TAGS_CONFIG.personal||[]).map(t=>({...t,group:'personal'})),
  ];
}

let allTasks = [], showDone = false, selectedTagId = null;
let tagGroups = {}, untagged = [], LAYOUT = [];

async function load() {
  const snap = await getDocs(collection(db, 'tasks'));
  allTasks = snap.docs.map(d => ({id:d.id, ...d.data()}));
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render();
}
async function init() { await loadTags(); await load(); }
requireAuth().then(migrateIfOwner).then(init).catch(e => {
  document.getElementById('loading').innerHTML =
    `<div style='color:var(--ink-soft);padding:24px;text-align:center'>Error: ${e.message}</div>`;
});

/* ─────────────────────────────────────────────
   GEOMETRY
   ───────────────────────────────────────────── */
const SVGNS='http://www.w3.org/2000/svg';
const CX=500,CY=500;
const R_HUB=28, R_IN=40, R_OUT=380;
const R_MIN=74;             // radius of the most-urgent (rank 1) dot
const GAP=12, PAD=1.4;
const sky=document.getElementById('sky');
let SCALE_MAX=8;

function el(n,a,p){const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function polar(r,deg){const a=deg*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function annularSector(r0,r1,a0,a1){
  const[x0,y0]=polar(r0,a0),[x1,y1]=polar(r1,a0),[x2,y2]=polar(r1,a1),[x3,y3]=polar(r0,a1);
  const lg=(a1-a0)>180?1:0;
  return `M${x0},${y0} L${x1},${y1} A${r1},${r1} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${lg},0 ${x0},${y0} Z`;
}
function arcPath(r,a0,a1){const[x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1);const lg=(a1-a0)>180?1:0;return `M${x0},${y0} A${r},${r} 0 ${lg},1 ${x1},${y1}`;}

// adaptive log scale: most-urgent rank sits near the centre (R_MIN), busiest ray reaches the rim
function fRad(rank){
  const r=Math.min(Math.max(rank,1),SCALE_MAX);
  const den=Math.log(1+SCALE_MAX)-Math.log(2);
  if(den<=0) return R_MIN;
  return R_MIN+(R_OUT-R_MIN)*(Math.log(1+r)-Math.log(2))/den;
}

function theme(){const e=document.documentElement.getAttribute('data-theme');return e||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function gradStops(hue,dark){return dark?[`hsl(${hue} 38% 30%)`,`hsl(${hue} 56% 52%)`]:[`hsl(${hue} 54% 87%)`,`hsl(${hue} 66% 64%)`];}
function tagInk(hue,dark){return dark?`hsl(${hue} 60% 82%)`:`hsl(${hue} 52% 34%)`;}
function tagSoft(hue,dark){return dark?`hsl(${hue} 34% 22%)`:`hsl(${hue} 60% 95%)`;}

const PR_RANK={high:0,med:1,low:2,none:3};
const DONE_GREY='#9aa1ab';
function isDone(t){return t.status==='done';}
function dotAttrs(t,dark){
  if(isDone(t)) return {fill:dark?'rgba(150,160,175,.5)':'rgba(150,158,170,.5)',stroke:dark?'rgba(150,160,175,.75)':'rgba(120,130,145,.6)',sw:1.3,r:5.2};
  const ring=dark?'rgba(238,244,252,.92)':'rgba(255,255,255,.96)';
  return {fill:'transparent',stroke:ring,sw:t.priority==='high'?3.2:1.7,r:t.priority==='high'?6.4:5.4};
}
function statusCol(t,hue,dark){return isDone(t)?DONE_GREY:tagInk(hue,dark);}

// urgency = earliest of deadline / nextAction
function urgDate(t){const ds=[t.deadline,t.nextAction].filter(Boolean).sort();return ds.length?ds[0]:null;}
function dueDisplay(t){return t.deadline||t.nextAction||null;}
function urgKey(t){return urgDate(t)||'∞';}
function sortByUrgency(list){
  return [...list].sort((a,b)=>{
    const ua=urgDate(a)?Date.parse(urgDate(a)):Infinity, ub=urgDate(b)?Date.parse(urgDate(b)):Infinity;
    return ua-ub || (PR_RANK[a.priority]??3)-(PR_RANK[b.priority]??3);
  });
}
function bucketize(sorted){
  const out=[]; let i=0;
  while(i<sorted.length){let j=i;const k=urgKey(sorted[i]);while(j<sorted.length&&urgKey(sorted[j])===k)j++;out.push({items:sorted.slice(i,j),p0:i,p1:j-1});i=j;}
  return out;
}

function todayStr(){return new Date().toISOString().split('T')[0];}
function daysDiff(a,b){return Math.round((new Date(b)-new Date(a))/(1000*60*60*24));}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${+d} ${mo[+m-1]}`;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trunc(s,n){return s.length>n?s.slice(0,Math.max(1,n-1))+'…':s;}

/* ── grouping + layout ── */
function computeGroups(){
  const vis = showDone ? allTasks : allTasks.filter(t=>!isDone(t));
  tagGroups={}; untagged=[];
  tagList().forEach(t=>tagGroups[t.id]=[]);
  vis.forEach(t=>{
    const tags=t.tags||[];
    if(!tags.length){untagged.push(t);return;}
    const primary=(t.primaryTag&&tags.includes(t.primaryTag))?t.primaryTag:tags[0];
    if(tagGroups[primary]) tagGroups[primary].push(t); else untagged.push(t);
  });
}
function layoutItems(){
  const base=tagList();
  const list = untagged.length ? [...base,{id:'__untagged',label:'Untagged',emoji:'📋',group:'personal'}] : base;
  const N=Math.max(1,list.length), avail=360-2*GAP, per=avail/N;
  const workCount=(TAGS_CONFIG.work||[]).length;
  let a=-90+GAP/2;
  return list.map((tag,i)=>{
    if(i===workCount) a+=GAP;
    const a0=a,a1=a+per,mid=(a0+a1)/2; a=a1;
    const raw = tag.id==='__untagged' ? untagged : (tagGroups[tag.id]||[]);
    const tasks=sortByUrgency(raw);
    const hue=Math.round(((mid+90)%360+360)%360);
    return {tag,i,a0,a1,mid,per,tasks,count:tasks.length,hue};
  });
}

function spreadY(ys,gap){
  const n=ys.length; if(!n) return ys;
  const idx=ys.map((y,i)=>i).sort((p,q)=>ys[p]-ys[q]);
  const out=ys.slice();
  for(let s=1;s<n;s++){const a=idx[s-1],b=idx[s];if(out[b]-out[a]<gap)out[b]=out[a]+gap;}
  const overflow=out[idx[n-1]]-(CY+R_OUT+70); if(overflow>0) idx.forEach(i=>out[i]-=overflow);
  const under=(CY-R_OUT-70)-out[idx[0]]; if(under>0) idx.forEach(i=>out[i]+=under);
  return out;
}

function render(){
  sky.innerHTML='';
  const dark=theme()==='dark';
  computeGroups();
  const items=layoutItems();
  LAYOUT=items;
  SCALE_MAX=Math.max(1,...items.map(it=>it.count));
  const activeTotal=allTasks.filter(t=>!isDone(t)).length;
  document.getElementById('stat').textContent=(showDone?allTasks.length:activeTotal)+(showDone?' tasks':' active');

  const defs=el('defs',{},sky);
  const gridG=el('g',{},sky);
  for(let c=1;c<=SCALE_MAX;c++) el('circle',{cx:CX,cy:CY,r:fRad(c),fill:'none',stroke:getVar('--grid'),'stroke-width':1},gridG);

  const raysG=el('g',{},sky);
  items.forEach(it=>{
    const stops=gradStops(it.hue,dark), gid='g'+it.i;
    const grad=el('radialGradient',{id:gid,gradientUnits:'userSpaceOnUse',cx:CX,cy:CY,r:R_OUT},defs);
    el('stop',{offset:(R_IN/R_OUT),'stop-color':stops[0]},grad);
    el('stop',{offset:1,'stop-color':stops[1]},grad);

    const rayG=el('g',{class:'ray'},raysG); rayG.dataset.tid=it.tag.id;

    if(it.count===0){
      // empty area — faint stub + muted label
      el('path',{class:'wedge',d:annularSector(R_IN,R_IN+16,it.a0+PAD,it.a1-PAD),fill:`url(#${gid})`,'fill-opacity':.4},rayG);
    } else {
      const outerR=fRad(it.count);
      el('path',{class:'wedge',d:annularSector(R_IN,outerR,it.a0+PAD,it.a1-PAD),fill:`url(#${gid})`},rayG);

      const dots=[];
      bucketize(it.tasks).forEach(b=>{
        const r=fRad((b.p0+b.p1)/2+1), m=b.items.length;
        const stepDeg=m>1?Math.min(11,(it.per-2*PAD-3)/m):0;
        b.items.forEach((task,bi)=>{
          const ang=it.mid+stepDeg*(bi-(m-1)/2);
          const[dx,dy]=polar(r,ang), da=dotAttrs(task,dark);
          const dot=el('circle',{class:'taskdot',cx:dx,cy:dy,r:da.r,fill:da.fill,stroke:da.stroke,'stroke-width':da.sw},rayG);
          el('title',{},dot).textContent=`${task.title}${dueDisplay(task)?' · '+fmtDate(dueDisplay(task)):''}`;
          dot.addEventListener('click',e=>{e.stopPropagation();showTaskDetail(it,task);});
          dots.push({task,dx,dy});
        });
      });

      const outer=fRad(it.count);
      el('path',{class:'cap',d:arcPath(outer,it.a0+PAD,it.a1-PAD),fill:'none',stroke:getVar('--cap'),'stroke-width':2.5,'stroke-linecap':'round'},rayG);
      const[nx,ny]=polar(outer+13,it.mid);
      el('text',{class:'count',x:nx,y:ny,'text-anchor':'middle','dominant-baseline':'middle','font-size':13,fill:getVar('--ink-soft')},rayG).textContent=it.count;

      const side=Math.cos(it.mid*Math.PI/180)>=0?1:-1;
      const baseYs=spreadY(dots.map(d=>d.dy),15);
      dots.forEach((d,k)=>{
        const y=baseYs[k], lx=d.dx+side*12;
        el('line',{class:'leader',x1:d.dx,y1:d.dy,x2:lx-side*3,y2:y},rayG);
        const tx=el('text',{class:'tasklabel',x:lx,y:y+3,'text-anchor':side>0?'start':'end',fill:getVar('--ink')},rayG);
        tx.textContent=trunc(d.task.title,22);
        el('title',{},tx).textContent=d.task.title;
      });
    }

    // tag label at the rim
    const cos=Math.cos(it.mid*Math.PI/180);
    const[lx,ly]=polar(R_OUT+30,it.mid);
    const lab=el('text',{class:'tag-label',x:lx,y:ly+4,
      'text-anchor':Math.abs(cos)<0.25?'middle':(cos>=0?'start':'end'),
      'font-size':13,fill:tagInk(it.hue,dark),opacity:it.count===0?0.45:1},rayG);
    lab.textContent=`${it.tag.emoji} ${it.tag.label}`;

    rayG.addEventListener('click',()=>showTagDetail(it));
    rayG.addEventListener('mouseenter',()=>dimOthers(it.tag.id));
    rayG.addEventListener('mouseleave',()=>dimOthers(null));
  });

  // centre hub
  const g=el('radialGradient',{id:'sun',cx:'40%',cy:'36%',r:'72%'},defs);
  el('stop',{offset:'0%','stop-color':getVar('--sun1')},g);
  el('stop',{offset:'100%','stop-color':getVar('--sun2')},g);
  const gg=el('radialGradient',{id:'glow',cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{offset:'0%','stop-color':getVar('--sun2'),'stop-opacity':.5},gg);
  el('stop',{offset:'100%','stop-color':getVar('--sun2'),'stop-opacity':0},gg);
  el('circle',{class:'glow',cx:CX,cy:CY,r:R_HUB+22,fill:'url(#glow)','pointer-events':'none'},sky);
  el('circle',{cx:CX,cy:CY,r:R_HUB,fill:'url(#sun)',stroke:getVar('--sun2'),'stroke-width':2},sky);

  applyDim();
}

function dimOthers(hoverId){
  const focus = hoverId!==null?hoverId:selectedTagId;
  document.querySelectorAll('.ray').forEach(r=>r.classList.toggle('dim',focus!==null&&r.dataset.tid!==focus));
}
function applyDim(){dimOthers(null);}

/* ── PANEL ── */
const panel=document.getElementById('panel');
function openPanel(){panel.classList.add('open');}
window.closeDetail=function(){panel.classList.remove('open');selectedTagId=null;applyDim();};
document.getElementById('p-close').addEventListener('click',window.closeDetail);

function findItem(task){
  const tags=task.tags||[];
  const primary=(task.primaryTag&&tags.includes(task.primaryTag))?task.primaryTag:tags[0];
  return LAYOUT.find(it=>it.tag.id===primary) || LAYOUT.find(it=>it.tag.id==='__untagged') || LAYOUT[0] || {hue:220,tag:{id:'',emoji:'',label:''}};
}

function showTagDetail(it){
  selectedTagId=it.tag.id; applyDim();
  const dark=theme()==='dark', tag=it.tag;
  const active=it.tasks.filter(t=>!isDone(t)), done=(tag.id==='__untagged'?untagged:(tagGroups[tag.id]||[])).filter(isDone);
  document.getElementById('p-accent').style.background=tagInk(it.hue,dark);
  const kind=document.getElementById('p-kind');
  kind.textContent = tag.id==='__untagged' ? 'Без тэга' : (tag.group==='work'?'Рабочий тэг':'Личный тэг');
  kind.style.color=tagInk(it.hue,dark);
  document.getElementById('p-title').textContent=`${tag.emoji} ${tag.label}`;
  document.getElementById('p-chips').innerHTML=
    `<span class="chip" style="background:${tagSoft(it.hue,dark)};color:${tagInk(it.hue,dark)}">${it.tasks.length} задач</span>`+
    `<span class="chip" style="background:var(--bg);color:var(--ink-soft)">${done.length} готово</span>`;
  let html=`<div class="p-sec">По срочности — сверху самое срочное</div>`;
  html += active.length ? active.map((t,i)=>rowHtml(t,i+1)).join('') : `<div class="note">Нет активных задач</div>`;
  if(showDone && done.length) html+=`<div class="p-sec">Выполнено</div>`+done.map(t=>rowHtml(t)).join('');
  if(tag.id==='__untagged')
    html+=`<button class="add-btn" onclick="presetAdd('')">+ Новая задача</button>`;
  else
    html+=`<button class="add-btn" onclick="presetAdd('${tag.id}')">+ Добавить задачу в «${esc(tag.label)}»</button>`;
  document.getElementById('p-body').innerHTML=html;
  openPanel();
}
function rowHtml(t,n){
  const rdot=isDone(t)
    ? `<span class="rdot" style="background:${DONE_GREY}"></span>`
    : `<span class="rdot" style="background:transparent;border:${t.priority==='high'?'3px':'1.7px'} solid var(--ink-soft)"></span>`;
  const due=dueDisplay(t);
  return `<div class="row ${isDone(t)?'done':''}" onclick="showTaskById('${t.id}')">`+
    `${n?`<span class="rnum">${n}</span>`:'<span class="rnum"></span>'}${rdot}`+
    `<span class="rt">${esc(t.title)}</span>${due?`<span class="rdue">${fmtDate(due)}</span>`:''}</div>`;
}

function showTaskDetail(it,task){
  selectedTagId=it.tag.id; applyDim();
  const dark=theme()==='dark', done=isDone(task), sc=statusCol(task,it.hue,dark);
  const statusLabels={new:'New','in-progress':'In Progress',blocked:'Blocked',done:'Done'};
  const subtasks=task.subtasks||[];
  document.getElementById('p-accent').style.background=sc;
  const kind=document.getElementById('p-kind'); kind.textContent='Задача'; kind.style.color=tagInk(it.hue,dark);
  document.getElementById('p-title').textContent=task.title;
  const prLabel={high:'Высокий приоритет',med:'Средний',low:'Обычный',none:'Без приоритета'}[task.priority||'none'];
  let chips=`<span class="chip" style="background:${sc}22;color:${sc}">${done?'Готово':(statusLabels[task.status]||'New')}</span>`;
  if(!done) chips+=`<span class="chip" style="background:var(--bg);color:var(--ink-soft)">${prLabel}</span>`;
  if(task.deadline) chips+=`<span class="chip" style="background:var(--bg);color:var(--ink-soft)">📅 ${fmtDate(task.deadline)}</span>`;
  if(task.recurring) chips+=`<span class="chip" style="background:${tagSoft(it.hue,dark)};color:${tagInk(it.hue,dark)}">♻ ${task.recurring.frequency}</span>`;
  chips+=`<span class="chip" style="background:${tagSoft(it.hue,dark)};color:${tagInk(it.hue,dark)}">${it.tag.emoji} ${esc(it.tag.label)}</span>`;
  document.getElementById('p-chips').innerHTML=chips;

  let html='';
  if(task.notes) html+=`<div class="note">${esc(task.notes)}</div>`;
  if(subtasks.length){
    const dn=subtasks.filter(s=>s.status==='done').length;
    html+=`<div class="p-sec">Подзадачи (${dn}/${subtasks.length}) — тап переключает</div>`;
    html+=subtasks.map((s,i)=>`<div class="subrow" onclick="toggleSub('${task.id}',${i})">`+
      `<div class="check ${s.status==='done'?'done':''}">${s.status==='done'?'✓':''}</div>`+
      `<div><div style="${s.status==='done'?'text-decoration:line-through;opacity:.6':''}">${esc(s.title)}</div>`+
      `${s.note?`<div style="font-size:11px;color:var(--ink-soft);margin-top:2px">${esc(s.note)}</div>`:''}</div></div>`).join('');
  }
  html+=`<button class="done-btn ${done?'reopen':''}" onclick="markDone('${task.id}')">${done?'↩ Вернуть в работу':'✓ Отметить выполненной'}</button>`;
  html+=`<button class="open-btn" style="background:${tagInk(it.hue,dark)}" onclick="openTaskPage('${task.id}')">→ Открыть задачу</button>`;
  html+=`<button class="add-btn" onclick="openTaskPage('${task.id}')">+ Добавить подзадачу</button>`;
  document.getElementById('p-body').innerHTML=html;
  openPanel();
}

window.showTaskById=function(id){
  const t=allTasks.find(x=>x.id===id); if(!t){window.closeDetail();return;}
  showTaskDetail(findItem(t),t);
};
window.openTaskPage=function(id){localStorage.setItem('currentTaskId',id);window.location.href='task.html';};
window.presetAdd=function(tagId){if(tagId) localStorage.setItem('newTaskPresetTag',tagId);window.location.href='add-task.html';};

/* ── QUICK ACTIONS (write to Firestore, re-render) ── */
function advanceDate(dateStr,frequency,interval){
  const d=new Date(dateStr+'T12:00:00');
  switch(frequency){case 'daily':d.setDate(d.getDate()+interval);break;case 'weekly':d.setDate(d.getDate()+7*interval);break;
    case 'monthly':d.setMonth(d.getMonth()+interval);break;case 'yearly':d.setFullYear(d.getFullYear()+interval);break;}
  return d.toISOString().split('T')[0];
}
function nextOccurrence(baseStr,frequency,interval){
  const today=todayStr(); let next=advanceDate(baseStr,frequency,interval),guard=0;
  while(next<=today&&guard++<1000) next=advanceDate(next,frequency,interval);
  return next;
}
window.toggleSub=async function(taskId,idx){
  const t=allTasks.find(x=>x.id===taskId); const s=t&&(t.subtasks||[])[idx]; if(!s)return;
  s.status = s.status==='done' ? 'new' : 'done';
  try{ await setDoc(doc(db,'tasks',taskId), t);}catch(e){console.error(e);return;}
  render(); showTaskById(taskId);
};
window.markDone=async function(taskId){
  const t=allTasks.find(x=>x.id===taskId); if(!t)return;
  try{
    if(t.status!=='done' && t.recurring){
      const rec=t.recurring, base=rec.nextDue||t.deadline||todayStr();
      const next=nextOccurrence(base,rec.frequency,rec.interval||1);
      const archiveId='task-'+Date.now()+'-'+Math.random().toString(36).slice(2,5);
      const archived={...t,id:archiveId,status:'done',doneAt:new Date().toISOString(),recurring:null};
      await setDoc(doc(db,'tasks',archiveId),archived);
      t.status='new'; t.doneAt=null; t.deadline=next; t.nextAction=null;
      t.subtasks=(t.subtasks||[]).map(s=>({...s,status:'new'}));
      t.recurring={...rec,nextDue:next};
      await setDoc(doc(db,'tasks',t.id),t);
      allTasks.push(archived);
    } else if(t.status!=='done'){
      t.status='done'; t.doneAt=new Date().toISOString();
      await setDoc(doc(db,'tasks',t.id),t);
    } else {
      t.status='new'; t.doneAt=null;
      await setDoc(doc(db,'tasks',t.id),t);
    }
  }catch(e){console.error(e);return;}
  render();
  // reopen if still visible, else close
  if(showDone || t.status!=='done') showTaskById(t.id); else window.closeDetail();
};

/* ── CONTROLS ── */
document.getElementById('show-tasks').addEventListener('change',e=>document.body.classList.toggle('show-tasks',e.target.checked));
document.getElementById('show-done').addEventListener('change',e=>{showDone=e.target.checked;render();window.closeDetail();});
document.getElementById('theme-btn').addEventListener('click',()=>{const c=theme();document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');render();window.closeDetail();});

const legend=document.querySelector('.legend'), legendBtn=document.getElementById('legend-btn');
function toggleLegend(on){const show=on!==undefined?on:!legend.classList.contains('show');legend.classList.toggle('show',show);legendBtn.classList.toggle('on',show);}
legendBtn.addEventListener('click',e=>{e.stopPropagation();toggleLegend();});
document.addEventListener('click',e=>{if(legend.classList.contains('show')&&!legend.contains(e.target)&&e.target!==legendBtn)toggleLegend(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleLegend(false);window.closeDetail();}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.getAttribute('data-theme'))render();});
